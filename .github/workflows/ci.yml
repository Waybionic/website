name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waybionic
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: waybionic/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Google Fonts sometimes returns extensionless font URLs that next/font in
        # Next 15 cannot handle, which fails the build intermittently; retry once.
        run: npm run build || npm run build
